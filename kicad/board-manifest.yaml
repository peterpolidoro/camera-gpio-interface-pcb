schema: orb-weaver/board-manifest/1
board: camera-gpio-interface-pcb
project: camera-gpio-interface-pcb.kicad_pro
summary: 'Camera GPIO interface for the three FLIR Blackfly S cameras of the joystick rig: three pluggable screw-terminal
  camera channels, two BNC inputs from the pyControl breakout, four 3.3 V BNC outputs to a Neuropixels OneBox, an
  InstrumentPort-Digital-50 with every camera line tapped, USB power; no MCU; v1.0 as built.'
rules:
  profiles:
  - instrument-taps
  - hv-power-24v
  grid_mm: 1.0
  datum:
    kind: aux axis origin
    kicad_mm: [150.0, 95.0]
sheets:
- name: inputs
  file: inputs.kicad_sch
  parent: /
  ports:
    +3.3V: +3.3V
    +5V: +5V
    GND: GND
    SYNC_IN: SYNC_IN
    SYNC_IN_INST: SYNC_IN_INST
    TRIG_IN: TRIG_IN
    TRIG_IN_INST: TRIG_IN_INST
  note: board-authored sheet, 7 parts
- name: power
  file: power.kicad_sch
  parent: /
  ports:
    +3.3V: +3.3V
    +5V: +5V
    GND: GND
  note: board-authored sheet, 2 parts
- name: outputs
  file: outputs.kicad_sch
  parent: /
  ports:
    +3.3V: +3.3V
    +5V: +5V
    CAM1_OUT_BNC: CAM1_OUT_BNC
    CAM2_OUT_BNC: CAM2_OUT_BNC
    CAM3_OUT_BNC: CAM3_OUT_BNC
    GND: GND
    SYNC_IN: SYNC_IN
    SYNC_OUT_INST: SYNC_OUT_INST
  note: board-authored sheet, 12 parts
placements:
- name: blackfly_s_gpio_channel_mcv6_vertical
  block: orb_weaver_blackfly_s_gpio_channel:blackfly_s_gpio_channel_mcv6_vertical
  parent: /
  anchor_mm: [-25.0, -24.0]
  rotation_degrees: 180
  side: front
  anchor_rule: 'inferred (block not in the anchor table): the group''s one connector, pad-array centre'
  connections:
    +3.3V: +3.3V
    +5V: +5V
    CAM_OUT_BNC: CAM1_OUT_BNC
    GND: GND
    L0_INST: CAM1_L0_INST
    L1_INST: CAM1_L1_INST
    L2_INST: CAM1_L2_INST
    L3_INST: CAM1_L3_INST
    OUT_INST: CAM1_OUT_INST
    SYNC_IN: SYNC_IN
    TRIG_IN: TRIG_IN
- name: logic_input_2ch_5v_schmitt_sn74lvc2g17
