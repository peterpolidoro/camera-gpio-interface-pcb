notes:
- 'Fixed at 3.3 V: the OneBox ADC inputs are high impedance with a ±5 V range, and anything fed back into a pyControl BNC
  must stay under that board''s 3.3 V clamps. 470 Ω (0603, 1/10 W) rather than 50 Ω: a shorted BNC costs 7 mA, and a OneBox
  DAC left switched in on the shared pin holds the node at the clamp (about −0.8 V or +5.5 V) for 12 mA through the driver
  and 64 mW in the resistor, inside both ratings. Into a ~1 MΩ ADC input the resistor costs 0.05 % of amplitude and about
  140 ns of edge.'
- 'U401 (SN74LVC1G125, ~OE to ground) drives SYNC_OUT from SYNC_IN, a driver of its own so a fault on the OneBox cable cannot
  disturb the three camera drivers that share SYNC_IN; R402 (470 Ω) makes SYNC_OUT_BNC at J401. The CAMn_OUT_BNC nets arrive
  from the camera blocks already behind their 470 Ω and meet only their jacks and the clamps here: J402 CAM1, J403 CAM2, J404
  CAM3.'
- 'USBLC6-2P6 is a two-line array (pins 1/6 one node, 3/4 the other): U402 pairs CAM1 OUT with CAM2 OUT and U403 CAM3 OUT
  with SYNC OUT, VBUS on +5V. C401 decouples U401; U401 pin 5 is the package''s NC pin, left open.'
- D401 through R401 (680 Ω) shows activity on SYNC_OUT. R403 (100 Ω) taps SYNC_OUT to SYNC_OUT_INST (DIG2) at the driver output
  before the 470 Ω, so the InstrumentPort sees what the BNC carries.
