- name: +3.3V
  shape: passive
  shared: true
- name: +5V
  shape: passive
  shared: true
- name: CAM1_OUT_BNC
  shape: input
- name: CAM2_OUT_BNC
  shape: input
- name: CAM3_OUT_BNC
  shape: input
- name: GND
  shape: passive
  shared: true
- name: SYNC_IN
  shape: input
- name: SYNC_OUT_INST
  shape: input
blocks: []
