schema: orb-weaver/subsystem/1
name: outputs
summary: 'The four 3.3 V BNC outputs to the Neuropixels OneBox: SYNC OUT from its own SN74LVC1G125 driver on SYNC_IN through
  470 Ω, and the three CAMn OUT lines the camera channels drive through their own 470 Ω; two USBLC6 clamps across the four
  jacks, referenced to +5V; an activity LED and the InstrumentPort tap on SYNC OUT.'
