    - J403
    - J404
    value: HL-BNC-KHDA
    role: 'the output BNC jacks: J401 SYNC OUT, J402 CAM1 OUT, J403 CAM2 OUT, J404 CAM3 OUT'
  - part: OW-PASS-RC0402FR-07680RL
